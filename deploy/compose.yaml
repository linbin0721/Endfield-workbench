services:
  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    user: app
    tmpfs:
      - /tmp:size=128m,mode=1777
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:?Set exact HTTPS frontend origin}
      MAX_WORKERS: "2"
      MAX_QUEUED: "8"
      MAX_UPLOADS: "2"
      RESULT_TTL_SECONDS: "900"
      MAX_RETAINED: "100"
      SOLVE_TIME_LIMIT_SECONDS: "3"
      SOLVE_MAX_NODES: "300000"
      RECOGNIZE_TIME_LIMIT_SECONDS: "25"
      CATALOG_DB_HOST: db
      CATALOG_DB_PORT: "5432"
      CATALOG_DB_NAME: ${CATALOG_DB_NAME:?Set catalog database name}
      CATALOG_DB_USER: ${CATALOG_DB_USER:?Set catalog database user}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?Set catalog database password}
      CATALOG_DB_TIMEOUT_SECONDS: "3"
    # Start ordering only: the API must keep serving recognition and solving
    # even when the catalog database is down, so it does not wait for health.
    depends_on:
      db:
        condition: service_started
    expose:
      - "8000"
    cpus: 2.0
    mem_limit: 2g
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 180s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).close()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    # Catalog storage stays on the Compose network: the service publishes no
    # host port, so PostgreSQL is never reachable from outside this stack.
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CATALOG_DB_NAME:?Set catalog database name}
      POSTGRES_USER: ${CATALOG_DB_USER:?Set catalog database user}
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:?Set catalog database password}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - catalog_data:/var/lib/postgresql/data
    expose:
      - "5432"
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 128
    shm_size: 128m
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set public API domain}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  catalog_data:
  caddy_data:
  caddy_config:
