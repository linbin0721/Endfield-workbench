services:
  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    user: app
    tmpfs:
      - /tmp:size=128m,mode=1777
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:?Set exact HTTPS frontend origin}
      MAX_WORKERS: "2"
      MAX_QUEUED: "8"
      MAX_UPLOADS: "2"
      RESULT_TTL_SECONDS: "900"
      MAX_RETAINED: "100"
      SOLVE_TIME_LIMIT_SECONDS: "3"
      SOLVE_MAX_NODES: "300000"
      RECOGNIZE_TIME_LIMIT_SECONDS: "25"
    expose:
      - "8000"
    cpus: 2.0
    mem_limit: 2g
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 180s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).close()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set public API domain}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
