<!doctype html>
<html lang="zh-CN" data-surface="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 10 18%22%3E%3Cpath d=%22M0 0h10v13L0 18z%22 fill=%22%23fff200%22/%3E%3C/svg%3E" />
    <title>Endfield Workbench · Design preview</title>
    <script>
      // Apply the saved theme before first paint (key shared with ThemeProvider); light by default.
      try {
        document.documentElement.dataset.surface = localStorage.getItem("ew-theme") === "dark" ? "dark" : "light";
      } catch (error) {
        document.documentElement.dataset.surface = "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
