<!doctype html>
<html lang="zh-CN" data-surface="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/src/shell/favicon.svg" />
    <title>终末地解谜助手</title>
    <!-- Apply the saved theme (light by default) before first paint; ui/theme.tsx uses the same key. -->
    <script>
      (function () {
        var theme = "light";
        try {
          if (window.localStorage.getItem("ew-theme") === "dark") theme = "dark";
        } catch (error) {}
        document.documentElement.setAttribute("data-surface", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
